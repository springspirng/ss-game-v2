<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Life need some BUG</title>
<style>
  :root{ --bg:#000; --wall:#3B6EF5; --plat:#FFFFFF; --char:#FFD400; --hud:#4FC3F7; }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:var(--bg);overflow:hidden;
    font-family:"SF Mono","JetBrains Mono","Menlo","Consolas",monospace;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #game{display:block;background:var(--bg);transition:transform .45s ease;}
  #game.flipped{transform:rotate(180deg);}
  /* overlays */
  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:#C8C8C8;text-align:center;padding:24px;z-index:10;}
  .overlay.hidden{display:none;}
  h1{color:var(--char);font-size:26px;letter-spacing:2px;margin-bottom:6px;}
  .tag{color:var(--wall);font-size:13px;margin-bottom:28px;letter-spacing:1px;}
  button{font-family:inherit;font-size:18px;background:transparent;color:var(--char);
    border:1px solid var(--char);border-radius:6px;padding:14px 30px;cursor:pointer;letter-spacing:2px;}
  button:active{background:var(--char);color:#000;}
  .hint{color:#666;font-size:12px;margin-top:24px;line-height:1.7;max-width:280px;}
  #countNum{font-size:96px;color:var(--char);line-height:1;}
  #countMsg{color:var(--hud);font-size:15px;margin-top:14px;letter-spacing:1px;}
  #countHint{color:#555;font-size:12px;margin-top:8px;}
  #winTitle{color:var(--char);font-size:30px;letter-spacing:2px;}
  #winBody{color:#C8C8C8;font-size:15px;margin-top:18px;line-height:1.8;max-width:300px;}
</style>
</head>
<body>
  <div id="wrap"><canvas id="game"></canvas></div>

  <!-- 標題 -->
  <div id="titleScreen" class="overlay">
    <h1>Life need some BUG</h1>
    <div class="tag">一個永遠下不完的樓梯</div>
    <button id="startBtn">▼ START</button>
    <div class="hint">左右半邊點按＝移動<br>螢幕會倒數 5 秒…<br>試著找出「出口」</div>
  </div>

  <!-- 倒數 -->
  <div id="countScreen" class="overlay hidden">
    <div id="countNum">5</div>
    <div id="countMsg">準備下樓…</div>
    <div id="countHint">t · u · r · n</div>
  </div>

  <!-- 通關 -->
  <div id="winScreen" class="overlay hidden">
    <div id="winTitle">69F · 出口</div>
    <div id="winBody"></div>
    <button id="againBtn" style="margin-top:26px;">再玩一次</button>
  </div>

<script>
(function(){
  "use strict";
  var cv = document.getElementById("game");
  var ctx = cv.getContext("2d");
  var W=0,H=0, charW=0, cellH=0, fontSize=0, cols=0;

  // ---- 版面 / 尺寸 ----
  function resize(){
    W = Math.min(window.innerWidth, 460);
    H = window.innerHeight;
    cv.width = W; cv.height = H;
    fontSize = Math.max(14, Math.floor(W/24));
    ctx.font = fontSize+"px monospace";
    charW = ctx.measureText("M").width;
    cellH = Math.round(fontSize*1.15);
    cols = Math.floor(W/charW);
    ctx.textBaseline = "top";
  }
  window.addEventListener("resize", resize);
  resize();

  // ---- 遊戲參數 ----
  var WALL = "[#]";
  var wallW = 0;
  var TURN = ["t","u","r","n"];
  var G = 1300;           // 重力 px/s^2
  var SCROLL0 = 70;       // 初始捲動速度
  var MOVE = 230;         // 左右移動速度
  var GAP = 0;            // 平台垂直間距（resize 後算）
  var ceilingY = 0;

  // ---- 狀態 ----
  var state = "title";    // title | count | play | win
  var reverse = false;    // 反向（上樓）模式
  var armed = false;      // 倒數內是否已翻轉
  var platforms = [];
  var pid = 0, spawnN = 0;
  var lastLanded = -1;
  var floor = 0, score = 0, life = 0;
  var scrollSpeed = SCROLL0;
  var moveDir = 0;        // -1 / 0 / 1（裝置座標）
  var char = {x:0,y:0,vy:0,onGround:false};
  var lastT = 0, countEnd=0, countLeft=5, countTimer=null;

  // ---- 感測器（翻轉判定：Y 軸符號 + 夾角 雙保險）----
  var gNow={x:0,y:0,z:0}, gRef=null, refYSign=0, haveSensor=false;
  function onMotion(e){
    var g=e.accelerationIncludingGravity;
    if(g && g.x!=null){ gNow={x:g.x,y:g.y,z:g.z}; haveSensor=true; }
  }
  function onOrient(e){
    if(!haveSensor && e.beta!=null){
      var br=e.beta*Math.PI/180, gr=(e.gamma||0)*Math.PI/180;
      gNow={x:-Math.sin(gr), y:Math.sin(br)*Math.cos(gr), z:Math.cos(br)*Math.cos(gr)};
    }
  }
  function captureRef(){ gRef={x:gNow.x,y:gNow.y,z:gNow.z}; refYSign = gNow.y>=0?1:-1; }
  function angle(a,b){
    var ma=Math.hypot(a.x,a.y,a.z)||1, mb=Math.hypot(b.x,b.y,b.z)||1;
    var d=(a.x*b.x+a.y*b.y+a.z*b.z)/(ma*mb);
    if(d>1)d=1; if(d<-1)d=-1; return Math.acos(d)*180/Math.PI;
  }
  function isFlipped(){
    if(!gRef) return false;
    // 主：裝置 Y 軸重力符號相對基準反轉，且量值夠大
    var ySign = gNow.y>=0?1:-1;
    if(refYSign!==0 && ySign!==refYSign && Math.abs(gNow.y)>4) return true;
    // 備：3D 夾角（實測翻轉最大約 140°，門檻設 120）
    if(angle(gNow,gRef)>120) return true;
    return false;
  }
  function enableSensors(){
    try{
      if(typeof DeviceMotionEvent!=="undefined" && typeof DeviceMotionEvent.requestPermission==="function"){
        DeviceMotionEvent.requestPermission().catch(function(){});
        if(typeof DeviceOrientationEvent!=="undefined" && DeviceOrientationEvent.requestPermission)
          DeviceOrientationEvent.requestPermission().catch(function(){});
      }
    }catch(e){}
    window.addEventListener("devicemotion", onMotion, true);
    window.addEventListener("deviceorientation", onOrient, true);
  }

  // ---- 平台 ----
  function makePlatform(y){
    var w = (5 + Math.floor(Math.random()*5)) * charW;   // 5~9 字寬
    var minX = wallW + charW, maxX = W - wallW - w - charW;
    var x = minX + Math.random()*(maxX-minX);
    var spike = spawnN>3 && Math.random()<0.22;
    var letter = TURN[spawnN % 4];
    spawnN++;
    return {id:pid++, x:x, y:y, w:w, spike:spike, letter:letter};
  }
  function resetPlatforms(){
    platforms=[]; pid=0; spawnN=0; lastLanded=-1;
    var y = ceilingY + cellH*3;
    while(y < H + cellH){ platforms.push(makePlatform(y)); y += GAP; }
  }

  // ---- 開局 ----
  function initGeom(){
    wallW = ctx.measureText(WALL).width;
    ceilingY = cellH*2.2;
    GAP = cellH*4;
  }
  function startPlay(){
    initGeom();
    reverse = armed;
    floor=0; score=0; life=0; scrollSpeed=SCROLL0;
    resetPlatforms();
    // 角色放在最上面那塊平台上
    var top = platforms[0];
    char.x = top.x + top.w/2 - charW/2;
    char.y = top.y - cellH;
    char.vy = 0; char.onGround=true; lastLanded=top.id;
    cv.classList.toggle("flipped", reverse);
    state="play"; lastT=performance.now();
    requestAnimationFrame(loop);
  }

  // ---- 倒數 ----
  function startCountdown(){
    document.getElementById("titleScreen").classList.add("hidden");
    document.getElementById("countScreen").classList.remove("hidden");
    enableSensors();
    setTimeout(captureRef, 300); // 給感測器一點時間，擷取基準
    armed=false; countLeft=5;
    document.getElementById("countNum").textContent = countLeft;
    document.getElementById("countMsg").textContent = "準備下樓…";
    clearInterval(countTimer);
    var detect = setInterval(function(){ if(isFlipped()) armed=true; }, 80);
    countTimer = setInterval(function(){
      countLeft--;
      if(countLeft>0){ document.getElementById("countNum").textContent = countLeft; }
      if(armed){ document.getElementById("countMsg").textContent = "↑ 偵測到翻轉！"; }
      if(countLeft<=0){
        clearInterval(countTimer); clearInterval(detect);
        document.getElementById("countScreen").classList.add("hidden");
        startPlay();
      }
    },1000);
  }

  // ---- 主迴圈 ----
  function loop(t){
    if(state!=="play") return;
    var dt = Math.min(0.05,(t-lastT)/1000); lastT=t;
    update(dt); render();
    requestAnimationFrame(loop);
  }

  function update(dt){
    // 難度隨層數微增
    scrollSpeed = SCROLL0 + Math.min(80, floor*0.8);
    // 平台上移
    for(var i=0;i<platforms.length;i++){ platforms[i].y -= scrollSpeed*dt; }
    // 移除跑出上方的、補生成下方的
    platforms = platforms.filter(function(p){ return p.y > ceilingY - cellH*2; });
    var lowest = platforms.length ? platforms[platforms.length-1].y : ceilingY;
    while(lowest < H + cellH){ lowest += GAP; platforms.push(makePlatform(lowest)); }

    // 左右移動（反向模式反轉方向）
    var dir = reverse ? -moveDir : moveDir;
    char.x += dir*MOVE*dt;
    if(char.x < wallW) char.x = wallW;
    if(char.x > W-wallW-charW) char.x = W-wallW-charW;

    // 重力
    var prevFeet = char.y + cellH;
    char.vy += G*dt; char.y += char.vy*dt;
    var feet = char.y + cellH;

    // 落地判定
    char.onGround=false;
    for(var j=0;j<platforms.length;j++){
      var p=platforms[j];
      if(char.vy>=0 && prevFeet<=p.y+6 && feet>=p.y &&
         char.x+charW>p.x && char.x<p.x+p.w){
        char.y = p.y - cellH; char.vy=0; char.onGround=true;
        // 踩到新平台
        if(p.id!==lastLanded){
          lastLanded=p.id; floor++; score++;
          if(p.spike) life--;   // 尖刺平台扣血
          if(reverse && floor>=69){ doWin(); return; }
        }
        break;
      }
    }
    // 站著就跟著平台上移一點（手感更穩）
    if(char.onGround){ char.y -= scrollSpeed*dt; }

    // 撞天花板尖刺
    if(char.y < ceilingY){ char.y = ceilingY; char.vy = 120; life--; }
    // 掉出底部 → 扣血、回到最上面平台
    if(char.y > H){
      life--;
      var top = platforms[0];
      char.x = top.x+top.w/2-charW/2; char.y=top.y-cellH; char.vy=0; lastLanded=top.id;
    }
  }

  // ---- 繪製 ----
  function txt(s,x,y,color){ ctx.fillStyle=color; ctx.fillText(s,x,y); }
  function render(){
    ctx.clearRect(0,0,W,H);
    ctx.font = fontSize+"px monospace"; ctx.textBaseline="top";

    // 天花板尖刺（朝下 v）
    var vline=""; for(var c=0;c<cols;c++) vline+="v";
    txt(vline, 0, ceilingY-cellH, "#FFFFFF");

    // 左右牆
    for(var y=ceilingY; y<H; y+=cellH){
      txt(WALL, 0, y, "#3B6EF5");
      txt(WALL, W-wallW, y, "#3B6EF5");
    }

    // 平台（TURN 字母）+ 平台尖刺（朝上 ^）
    for(var i=0;i<platforms.length;i++){
      var p=platforms[i];
      var n=Math.max(1,Math.round(p.w/charW));
      var body="["; for(var k=0;k<n;k++) body+=p.letter; body+="]";
      if(p.spike){
        var sp=""; for(var s=0;s<n;s++) sp+="^";
        txt(sp, p.x, p.y-cellH, "#FFFFFF");
      }
      txt(body, p.x, p.y, "#FFFFFF");
    }

    // 角色
    txt("웃", char.x, char.y, "#FFD400");

    // HUD
    ctx.font = Math.round(fontSize*0.9)+"px monospace";
    var fl = reverse ? (floor+"F") : ("B"+floor);
    txt("life :"+life, wallW+4, 6, "#4FC3F7");
    txt("score:"+score, wallW+4, 6+cellH, "#4FC3F7");
    txt(fl, W-wallW-charW*5, 6, "#4FC3F7");
    ctx.font = fontSize+"px monospace";
  }

  // ---- 通關 ----
  function doWin(){
    state="win";
    var ws=document.getElementById("winScreen");
    document.getElementById("winBody").innerHTML =
      "你發現了：往下不是唯一的方向。<br>有些 bug，是通往出口的門。";
    ws.classList.remove("hidden");
  }

  // ---- 輸入 ----
  function setDirFromX(clientX){ moveDir = (clientX < window.innerWidth/2) ? -1 : 1; }
  function press(e){ if(state!=="play")return; var x=(e.touches?e.touches[0].clientX:e.clientX); setDirFromX(x); }
  function release(){ moveDir=0; }
  cv.addEventListener("touchstart", press, {passive:true});
  cv.addEventListener("touchmove", press, {passive:true});
  cv.addEventListener("touchend", release);
  cv.addEventListener("mousedown", press);
  cv.addEventListener("mouseup", release);
  document.addEventListener("keydown", function(e){
    if(e.key==="ArrowLeft") moveDir=-1;
    else if(e.key==="ArrowRight") moveDir=1;
    else if((e.key==="f"||e.key==="F") && state==="count") armed=true; // 桌機模擬翻轉
  });
  document.addEventListener("keyup", function(e){
    if(e.key==="ArrowLeft"||e.key==="ArrowRight") moveDir=0;
  });

  // ---- 按鈕 ----
  document.getElementById("startBtn").addEventListener("click", startCountdown);
  document.getElementById("againBtn").addEventListener("click", function(){
    document.getElementById("winScreen").classList.add("hidden");
    document.getElementById("titleScreen").classList.remove("hidden");
    cv.classList.remove("flipped");
    state="title";
  });
})();
</script>
</body>
</html>
