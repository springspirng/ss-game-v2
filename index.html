<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Life need some BUG</title>
<style>
  :root{ --bg:#000; --wall:#3B6EF5; --plat:#FFFFFF; --char:#FFD400; --hud:#4FC3F7; --blood:#FF4D4D; }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:var(--bg);overflow:hidden;
    font-family:"SF Mono","JetBrains Mono","Menlo","Consolas",monospace;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #game{display:block;background:var(--bg);transition:transform .4s ease;}
  #game.flip180{transform:rotate(180deg);}
  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:#C8C8C8;text-align:center;padding:24px;z-index:10;overflow-y:auto;}
  .overlay.hidden{display:none;}
  .overlay.flip180{transform:rotate(180deg);}
  h1{color:var(--char);font-size:26px;letter-spacing:2px;margin-bottom:6px;}
  .tag{color:var(--wall);font-size:13px;margin-bottom:28px;letter-spacing:1px;}
  button{font-family:inherit;font-size:18px;background:transparent;color:var(--char);
    border:1px solid var(--char);border-radius:6px;padding:14px 30px;cursor:pointer;letter-spacing:2px;}
  button:active{background:var(--char);color:#000;}
  .hint{color:#666;font-size:12px;margin-top:24px;line-height:1.7;max-width:290px;}
  #countNum{font-size:96px;color:var(--char);line-height:1;}
  #countMsg{color:var(--hud);font-size:15px;margin-top:14px;letter-spacing:1px;}
  #countHint{color:#555;font-size:12px;margin-top:8px;}
  .big{font-size:30px;letter-spacing:2px;}
  #winTitle{color:var(--char);} #overTitle{color:var(--blood);}
  #winScreen{background:rgba(0,0,0,.92);}
  .body{color:#C8C8C8;font-size:15px;margin-top:18px;line-height:1.8;max-width:300px;}
  .subtag{color:#555;font-size:12px;letter-spacing:1px;margin-top:-6px;}
  .quote{color:#999;font-size:13px;font-style:italic;margin:12px auto;line-height:1.8;max-width:290px;}
  .giftBox{width:100%;max-width:240px;aspect-ratio:4/3;margin:14px auto;border:1px dashed #555;
    border-radius:10px;display:flex;align-items:center;justify-content:center;color:#555;font-size:13px;}
  .cta{color:var(--char);font-size:16px;letter-spacing:1px;margin-top:6px;}
  .redeemForm{width:100%;max-width:280px;margin:16px auto 0;display:flex;flex-direction:column;gap:12px;text-align:left;}
  .redeemForm label{display:block;color:#888;font-size:12px;letter-spacing:1px;margin-bottom:4px;}
  .redeemForm select,.redeemForm input{width:100%;font-family:inherit;font-size:14px;
    background:#111;color:#C8C8C8;border:1px solid #444;border-radius:6px;padding:10px 12px;}
  .redeemForm select:focus,.redeemForm input:focus{outline:none;border-color:var(--char);}
  .formNote{color:#555;font-size:11px;line-height:1.7;margin-top:12px;max-width:290px;}
</style>
</head>
<body>
  <div id="wrap"><canvas id="game"></canvas></div>

  <div id="titleScreen" class="overlay">
    <h1>Life need some BUG</h1>
    <div class="tag">一個永遠下不完的樓梯</div>
    <button id="startBtn">▼ START</button>
    <div class="hint">左右半邊點按＝移動<br>小心尖刺，五滴血用完就結束<br>試著找出「出口」…</div>
  </div>

  <div id="countScreen" class="overlay hidden">
    <div id="countNum">5</div>
    <div id="countMsg">以現在的拿法為基準…</div>
    <div id="countHint">t · u · r · n</div>
  </div>

  <div id="winScreen" class="overlay hidden">
    <div id="winTitle" class="big">69F · 出口</div>
    <div id="winBody" class="body"></div>
    <button id="againBtn" style="margin-top:26px;">再玩一次</button>
  </div>

  <div id="overScreen" class="overlay hidden">
    <div id="overTitle" class="big">GAME OVER</div>
    <div id="overBody" class="body"></div>
    <button id="retryBtn" style="margin-top:26px;">再玩一次</button>
  </div>

<script>
(function(){
  "use strict";
  var cv=document.getElementById("game"), ctx=cv.getContext("2d");
  var W=0,H=0,charW=0,cellH=0,fontSize=0,cols=0,wallW=0,bloodW=0;

  function resize(){
    W=Math.min(window.innerWidth,460); H=window.innerHeight;
    cv.width=W; cv.height=H;
    fontSize=Math.max(14,Math.floor(W/24));
    ctx.font=fontSize+"px monospace"; ctx.textBaseline="top";
    charW=ctx.measureText("M").width;
    cellH=Math.round(fontSize*1.15);
    cols=Math.floor(W/charW);
    wallW=ctx.measureText("[#]").width;
    bloodW=ctx.measureText("血").width;
  }
  window.addEventListener("resize",resize); resize();

  // 參數
  var TURN=["t","u","r","n"];
  var G=1500, SCROLL0=65, MOVE=240, JUMP=630, GAP=0, ceilingY=0, MAXLIFE=5;

  // 狀態
  var state="title";
  // 兩件事分開：畫面朝向(絕對) vs 遊戲模式(相對基準)
  var upsideDown=false;     // 手機當下是否實體上下顛倒（絕對，決定畫面翻不翻）
  var baseUp=false;         // 開場基準的朝向
  var climbing=false;       // 是否為上樓/跳躍模式（= 相對基準翻過）
  var manual=false, manualOn=false; // 桌機用 F 模擬翻轉
  var platforms=[], pid=0, spawnN=0, lastLanded=-1, lastSpike=false;
  var floor=0, score=0, life=MAXLIFE, scrollSpeed=SCROLL0;
  var climbReach=0, climbSinceSpike=99, climbBalance=0; // 上樓模式：可達距離 + 尖刺/補包配額
  var moveDir=0;
  var char={x:0,y:0,vy:0,onGround:false};
  var lastT=0, countLeft=5, countTimer=null, detectTimer=null;
  var hurtCd=0, flipCandidate=0;

  // 感測器
  var gNow={x:0,y:0,z:0}, refReady=false, haveSensor=false;
  function mag(g){return Math.hypot(g.x,g.y,g.z);}
  function onMotion(e){var g=e.accelerationIncludingGravity; if(g&&g.x!=null){gNow={x:g.x,y:g.y,z:g.z}; haveSensor=true;}}
  function onOrient(e){
    if(!haveSensor && e.beta!=null){
      var br=e.beta*Math.PI/180, gr=(e.gamma||0)*Math.PI/180;
      gNow={x:-Math.sin(gr),y:Math.sin(br)*Math.cos(gr),z:Math.cos(br)*Math.cos(gr)};
    }
  }
  function tryCaptureRef(){                     // 等有真實資料才擷取基準（修開場誤判）
    if(!refReady && haveSensor && mag(gNow)>5){
      baseUp = gNow.y>0; refReady=true;
    }
  }
  function enableSensors(){
    try{
      if(typeof DeviceMotionEvent!=="undefined" && typeof DeviceMotionEvent.requestPermission==="function"){
        DeviceMotionEvent.requestPermission().catch(function(){});
        if(typeof DeviceOrientationEvent!=="undefined" && DeviceOrientationEvent.requestPermission)
          DeviceOrientationEvent.requestPermission().catch(function(){});
      }
    }catch(e){}
    window.addEventListener("devicemotion",onMotion,true);
    window.addEventListener("deviceorientation",onOrient,true);
  }

  function rep(ch,n){var s="";for(var i=0;i<n;i++)s+=ch;return s;}

  // 平台：尖刺不連續（保證安全路線）+ 回血平台
  function makePlatform(y){
    var w=(5+Math.floor(Math.random()*5))*charW;
    var minX=wallW+charW, maxX=W-wallW-w-charW;
    var x=minX+Math.random()*Math.max(1,(maxX-minX));
    var type="normal";
    if(!lastSpike && spawnN>2 && Math.random()<0.18) type="spike";
    else if(Math.random()<0.16) type="heal";
    lastSpike=(type==="spike");
    var letter=TURN[spawnN%4]; spawnN++;
    return {id:pid++,x:x,y:y,w:w,type:type,used:false,letter:letter};
  }
  function resetPlatforms(){
    platforms=[];pid=0;spawnN=0;lastLanded=-1;lastSpike=false;
    var y=ceilingY+cellH*3;
    while(y<H+cellH){ platforms.push(makePlatform(y)); y+=GAP; }
  }
  function manageDown(){
    platforms=platforms.filter(function(p){return p.y>ceilingY-cellH*2;});
    var low=platforms.length?platforms[platforms.length-1].y:ceilingY;
    while(low<H+cellH){ low+=GAP; platforms.push(makePlatform(low)); }
  }
  // 上樓（通關）用的平台：x 位置一定被限制在「跳得到」的範圍內，
  // 尖刺機率降低、補包機率提高，並用 climbBalance 強制補血，確保不會必死。
  function makeClimbPlatform(y, ref){
    var w=(5+Math.floor(Math.random()*5))*charW;
    var minX=wallW+charW, maxX=W-wallW-w-charW;
    var x;
    if(ref){
      var targetCenter=ref.x+ref.w/2-w/2;
      var lo=Math.max(minX, targetCenter-climbReach), hi=Math.min(maxX, targetCenter+climbReach);
      x = (hi<=lo) ? Math.min(maxX,Math.max(minX,targetCenter)) : lo+Math.random()*(hi-lo);
    } else {
      x=minX+Math.random()*Math.max(1,(maxX-minX));
    }
    climbSinceSpike++;
    var type="normal";
    if(climbBalance>=2){ type="heal"; }                                   // 補血配額：尖刺欠太多，強制回血
    else if(climbSinceSpike>3 && spawnN>2 && Math.random()<0.10){ type="spike"; } // 尖刺：間隔至少 3 階才可能再出現
    else if(Math.random()<0.22){ type="heal"; }
    if(type==="spike"){ climbSinceSpike=0; climbBalance++; }
    else if(type==="heal"){ climbBalance--; }
    var letter=TURN[spawnN%4]; spawnN++;
    return {id:pid++,x:x,y:y,w:w,type:type,used:false,letter:letter};
  }
  function manageUp(){
    platforms=platforms.filter(function(p){return p.y<H+cellH*2;});
    var hi=platforms.length?platforms[0].y:H;
    while(hi>ceilingY-cellH){
      hi-=GAP;
      var ref=platforms.length?platforms[0]:null;
      platforms.unshift(makeClimbPlatform(hi, ref));
    }
  }

  function initGeom(){
    ceilingY=cellH*2.4; GAP=cellH*3.4;
    // 上樓每次自動彈跳的最大可達水平距離（含安全係數），用來限制下一階的位置
    var disc=Math.max(0, JUMP*JUMP-2*G*GAP);
    var flightT=(JUMP+Math.sqrt(disc))/G;
    climbReach=MOVE*flightT*0.7;
  }

  function startPlay(){
    initGeom();
    climbing=false; upsideDown=baseUp;
    cv.className = upsideDown?"flip180":"";
    floor=0; score=0; life=MAXLIFE; scrollSpeed=SCROLL0; hurtCd=0; flipCandidate=0;
    resetPlatforms();
    var top=platforms[0];
    char.x=top.x+top.w/2-charW/2; char.y=top.y-fontSize; char.vy=0; char.onGround=true; lastLanded=top.id;
    state="play"; lastT=performance.now(); requestAnimationFrame(loop);
  }

  function startCountdown(){
    document.getElementById("titleScreen").classList.add("hidden");
    document.getElementById("countScreen").classList.remove("hidden");
    enableSensors(); refReady=false; countLeft=5;
    document.getElementById("countNum").textContent=countLeft;
    clearInterval(detectTimer); detectTimer=setInterval(tryCaptureRef,100);
    clearInterval(countTimer);
    countTimer=setInterval(function(){
      countLeft--;
      if(countLeft>0) document.getElementById("countNum").textContent=countLeft;
      if(countLeft<=0){
        clearInterval(countTimer); clearInterval(detectTimer);
        document.getElementById("countScreen").classList.add("hidden");
        startPlay();
      }
    },1000);
  }

  // 切換模式（下樓 <-> 上樓），角色都站在平台上緣（邏輯座標一致）
  function toggleMode(){
    climbing=!climbing; floor=0; lastLanded=-1;
    if(climbing){ climbSinceSpike=99; climbBalance=0; }
    var p=null,best=1e9;
    for(var i=0;i<platforms.length;i++){
      var pl=platforms[i];
      if(char.x+charW>pl.x && char.x<pl.x+pl.w){
        var d=Math.abs(char.y-(pl.y-fontSize)); if(d<best){best=d;p=pl;}
      }
    }
    if(p){ lastLanded=p.id; char.y=p.y-fontSize; char.onGround=true; }
    char.vy = climbing?-JUMP:0;
  }

  function hurt(){ if(hurtCd>0)return; life--; hurtCd=0.8; if(life<=0) gameOver(); }
  function heal(p){ if(!p.used){ p.used=true; if(life<MAXLIFE) life++; } }

  function loop(t){
    if(state!=="play") return;
    var dt=Math.min(0.05,(t-lastT)/1000); lastT=t;
    update(dt); render(); requestAnimationFrame(loop);
  }

  function updateOrientation(dt){
    // 畫面朝向：手機絕對方向（重力 Y）
    if(manual) upsideDown=manualOn;
    else if(refReady){ if(gNow.y>4) upsideDown=true; else if(gNow.y<-4) upsideDown=false; }
    var cls = upsideDown?"flip180":"";
    if(cv.className!==cls) cv.className=cls;
    // 遊戲模式：相對基準是否翻過（去抖 0.3s）
    var climb = (upsideDown!==baseUp);
    if(climb!==climbing){ flipCandidate+=dt; if(flipCandidate>0.3){ toggleMode(); flipCandidate=0; } }
    else flipCandidate=0;
  }

  function update(dt){
    if(hurtCd>0) hurtCd-=dt;
    updateOrientation(dt);
    // 左右：手機顛倒時觸控座標對調 → 依絕對朝向反轉
    var dir = upsideDown?-moveDir:moveDir;
    char.x+=dir*MOVE*dt;
    if(char.x<wallW) char.x=wallW;
    if(char.x>W-wallW-charW) char.x=W-wallW-charW;
    if(!climbing) updateDown(dt); else updateUp(dt);
  }

  // 下樓：邏輯座標 下=+y。往下掉、踩平台上緣、平台向上捲
  function updateDown(dt){
    scrollSpeed=SCROLL0+Math.min(80,floor*0.8);
    var dy=-scrollSpeed*dt;
    for(var i=0;i<platforms.length;i++) platforms[i].y+=dy;
    manageDown();
    var prevFeet=char.y+fontSize;
    char.vy+=G*dt; char.y+=char.vy*dt;
    var feet=char.y+fontSize;
    char.onGround=false;
    for(var j=0;j<platforms.length;j++){
      var p=platforms[j];
      if(char.x+charW>p.x && char.x<p.x+p.w && char.vy>=0 && prevFeet<=p.y+6 && feet>=p.y){
        char.y=p.y-fontSize; char.vy=0; char.onGround=true; land(p); break;
      }
    }
    if(char.onGround) char.y+=dy;
    if(char.y<ceilingY){ char.y=ceilingY; char.vy=120; hurt(); }
    if(char.y>H){ respawnDown(); }
  }

  // 上樓：Doodle-Jump 式。往上跳（-y），相機跟隨，平台相對下移
  function updateUp(dt){
    var prevFeet=char.y+fontSize;
    char.vy+=G*dt; char.y+=char.vy*dt;
    var feet=char.y+fontSize;
    char.onGround=false;
    for(var j=0;j<platforms.length;j++){
      var p=platforms[j];
      if(char.x+charW>p.x && char.x<p.x+p.w && char.vy>0 && prevFeet<=p.y+6 && feet>=p.y){
        char.y=p.y-fontSize; char.vy=-JUMP; char.onGround=true; land(p); break; // 自動彈跳
      }
    }
    var camLine=H*0.45;
    if(char.y<camLine){ var delta=camLine-char.y; char.y=camLine; for(var i=0;i<platforms.length;i++) platforms[i].y+=delta; }
    manageUp();
    if(char.y>H){ respawnUp(); }
  }

  function land(p){
    if(p.id!==lastLanded){
      lastLanded=p.id; floor++; score++;
      if(p.type==="spike") hurt();
      else if(p.type==="heal") heal(p);
      if(climbing && floor>=69) doWin();
    }
  }
  function respawnDown(){ hurt(); if(state!=="play")return;
    var p=platforms[0]; char.x=p.x+p.w/2-charW/2; char.y=p.y-fontSize; char.vy=0; lastLanded=p.id; }
  function respawnUp(){ hurt(); if(state!=="play")return;
    var camLine=H*0.45, best=1e9, p=platforms[0];
    for(var i=0;i<platforms.length;i++){ var d=Math.abs(platforms[i].y-camLine); if(d<best){best=d;p=platforms[i];} }
    char.x=p.x+p.w/2-charW/2; char.y=p.y-fontSize; char.vy=-JUMP; lastLanded=p.id; }

  // 繪製（邏輯座標；畫面顛倒交給 CSS rotate 處理）
  function txt(s,x,y,c){ctx.fillStyle=c; ctx.fillText(s,x,y);}
  function render(){
    ctx.clearRect(0,0,W,H); ctx.font=fontSize+"px monospace"; ctx.textBaseline="top"; ctx.textAlign="left";
    txt(rep("v",cols),0,ceilingY-cellH,"#FFFFFF");
    for(var y=ceilingY;y<H;y+=cellH){ txt("[#]",0,y,"#3B6EF5"); txt("[#]",W-wallW,y,"#3B6EF5"); }
    for(var i=0;i<platforms.length;i++){
      var p=platforms[i], n=Math.max(1,Math.round(p.w/charW));
      if(p.type==="spike") txt(rep("^",n),p.x+charW,p.y-fontSize,"#FFFFFF");
      else if(p.type==="heal" && !p.used) txt("血",p.x+p.w/2-bloodW/2,p.y-fontSize,"#FF4D4D");
      txt("["+rep(p.letter,n)+"]",p.x,p.y,"#FFFFFF");
    }
    txt("웃",char.x,char.y,"#FFD400");
    // HUD
    ctx.font=Math.round(fontSize*0.95)+"px monospace";
    var bx=wallW+4;
    for(var b=0;b<MAXLIFE;b++){ txt("血",bx,6,b<life?"#FF4D4D":"#FFFFFF"); bx+=bloodW; }
    txt((climbing?(floor+"F"):("B"+floor)),W-wallW-charW*5,6,"#4FC3F7");
    txt("score:"+score,wallW+4,6+cellH,"#4FC3F7");
    ctx.font=fontSize+"px monospace";
  }

  function doWin(){ state="win";
    document.getElementById("winTitle").innerHTML="恭喜你找到 BUG 囉！<div class=\"subtag\">69F · 出口</div>";
    document.getElementById("winBody").innerHTML=
      '<div class="tag" style="margin-bottom:0;">給一成不變的生活來點 BUG 吧！</div>'+
      '<div class="quote">「適度的打破一些生活規則，透過不一樣的體驗，讓你的生活變得更有新鮮感」</div>'+
      '<div class="giftBox">＊贈品示意圖</div>'+
      '<div class="cta">即刻領取解鎖生活 BUG 包</div>'+
      '<div class="redeemForm">'+
        '<div><label>選擇最近的超商</label>'+
          '<select id="storeSelect"><option value="">請選擇超商</option>'+
          '<option>7-ELEVEN</option><option>全家 FamilyMart</option>'+
          '<option>萊爾富 Hi-Life</option><option>OK超商</option></select></div>'+
        '<div><label>電話</label><input type="tel" placeholder="請輸入手機號碼" id="phoneInput"></div>'+
        '<div><label>領取人</label><input type="text" placeholder="請輸入領取人姓名" id="nameInput"></div>'+
      '</div>'+
      '<div class="formNote">＊採超商店到店的方式兌換（示意畫面，尚未串接送出）</div>';
    var ws=document.getElementById("winScreen");
    ws.classList.remove("flip180");   // 破關訊息一律用正常方向顯示，輸入框/下拉選單才能正常操作
    ws.classList.remove("hidden"); }
  function gameOver(){ state="over";
    document.getElementById("overBody").innerHTML=(climbing?("爬到 "+floor+"F"):("下降到 B"+floor))+"<br>五滴血用完了。";
    var os=document.getElementById("overScreen");
    os.classList.toggle("flip180",upsideDown);
    os.classList.remove("hidden"); }

  // 輸入
  function press(e){ if(state!=="play")return; var x=(e.touches?e.touches[0].clientX:e.clientX); moveDir=(x<window.innerWidth/2)?-1:1; }
  function release(){ moveDir=0; }
  cv.addEventListener("touchstart",press,{passive:true});
  cv.addEventListener("touchmove",press,{passive:true});
  cv.addEventListener("touchend",release);
  cv.addEventListener("mousedown",press);
  cv.addEventListener("mouseup",release);
  document.addEventListener("keydown",function(e){
    if(e.key==="ArrowLeft")moveDir=-1;
    else if(e.key==="ArrowRight")moveDir=1;
    else if(e.key==="f"||e.key==="F"){ manual=true; manualOn=!manualOn; } // 桌機模擬實體翻轉
  });
  document.addEventListener("keyup",function(e){ if(e.key==="ArrowLeft"||e.key==="ArrowRight")moveDir=0; });

  function backToTitle(){ document.getElementById("titleScreen").classList.remove("hidden"); cv.className=""; state="title"; }
  document.getElementById("startBtn").addEventListener("click",startCountdown);
  document.getElementById("againBtn").addEventListener("click",function(){ document.getElementById("winScreen").classList.add("hidden"); backToTitle(); });
  document.getElementById("retryBtn").addEventListener("click",function(){ document.getElementById("overScreen").classList.add("hidden"); backToTitle(); });
})();
</script>
</body>
</html>
